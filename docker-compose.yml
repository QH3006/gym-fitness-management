version: "3.9"

# ====================================================================
# DOCKER COMPOSE TOÀN DIỆN - HỆ THỐNG QUẢN LÝ PHÒNG GYM & FITNESS (ĐỀ 23)
# Tích hợp: Web App + MySQL + phpMyAdmin + Nginx Reverse Proxy (SSL)
#           Prometheus + Grafana + Exporters + Loki + Promtail + Alertmanager
# Áp dụng Hardening: Network Isolation, Non-root, Healthchecks, Least Privilege
# ====================================================================

services:
  # ==========================================
  # PHẦN 1: ỨNG DỤNG WEB & CƠ SỞ DỮ LIỆU
  # ==========================================

  # 1.1 Cơ sở dữ liệu MySQL 8.0
  gym-db:
    image: mysql:8.0
    container_name: gym-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 1.2 Ứng dụng Web Quản lý Phòng Gym (PHP 8.3 Apache)
  gym-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: gym-db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      AES_SECRET_KEY: ${AES_SECRET_KEY}
    depends_on:
      gym-db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  # 1.3 Công cụ quản trị CSDL phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: gym-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: gym-db
      PMA_PORT: 3306
    ports:
      - "8085:80"
    depends_on:
      gym-db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  # ==========================================
  # PHẦN 2: NGINX REVERSE PROXY & HTTPS (COMMIT 1)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: gym-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - gym-web
      - phpmyadmin
    networks:
      - frontend-net

  # ==========================================
  # PHẦN 3: GIÁM SÁT PROMETHEUS + GRAFANA (COMMIT 2)
  # ==========================================

  # 3.1 Prometheus Server
  prometheus:
    image: prom/prometheus:latest
    container_name: gym-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring-net

  # 3.2 Grafana Dashboard (Tự động nạp datasource Prometheus & Loki)
  grafana:
    image: grafana/grafana:latest
    container_name: gym-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring-net

  # 3.3 cAdvisor - Giám sát Container Docker
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: gym-cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-net

  # 3.4 Node Exporter - Giám sát Hệ điều hành Máy chủ
  node-exporter:
    image: prom/node-exporter:latest
    container_name: gym-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - monitoring-net

  # 3.5 MySQL Exporter - Cầu nối lấy Metrics MySQL sang Prometheus
  mysql-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: gym-mysql-exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    environment:
      DATA_SOURCE_NAME: "${EXPORTER_USER}:${EXPORTER_PASSWORD}@tcp(gym-db:3306)/${MYSQL_DATABASE}"
    depends_on:
      gym-db:
        condition: service_healthy
    networks:
      - backend-net
      - monitoring-net

  # 3.6 Alertmanager - Quản lý Cảnh báo Prometheus
  alertmanager:
    image: prom/alertmanager:latest
    container_name: gym-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager
    depends_on:
      - prometheus
    networks:
      - monitoring-net

  # ==========================================
  # PHẦN 4: HỆ THỐNG LOG TẬP TRUNG LOKI + PROMTAIL (COMMIT 3)
  # ==========================================

  # 4.1 Grafana Loki Server
  loki:
    image: grafana/loki:latest
    container_name: gym-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/loki-config.yaml
    networks:
      - monitoring-net

  # 4.2 Grafana Promtail Collector
  promtail:
    image: grafana/promtail:latest
    container_name: gym-promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command:
      - -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - monitoring-net

# ==========================================
# CẤU HÌNH MẠNG CÔ LẬP (NETWORK ISOLATION)
# ==========================================
networks:
  frontend-net:
    driver: bridge
    name: gym-frontend-net

  backend-net:
    driver: bridge
    name: gym-backend-net

  monitoring-net:
    driver: bridge
    name: gym-monitoring-net

# ==========================================
# CẤU HÌNH DỮ LIỆU BỀN VỮNG (NAMED VOLUMES)
# ==========================================
volumes:
  db_data:
    name: gym_db_data
  prometheus_data:
    name: gym_prometheus_data
  grafana_data:
    name: gym_grafana_data
  loki_data:
    name: gym_loki_data
  alertmanager_data:
    name: gym_alertmanager_data
