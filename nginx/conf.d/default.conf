# ====================================================================
# NGINX REVERSE PROXY CONFIGURATION - HỆ THỐNG GYM & FITNESS (ĐỀ 23)
# Hỗ trợ: HTTPS Self-Signed SSL, 301 Redirect, Security Headers Hardening
# ====================================================================

# 1. Chuyển hướng toàn bộ traffic HTTP (Cổng 80) sang HTTPS (Cổng 443)
server {
    listen 80;
    server_name gym.local localhost;

    # Chuyển hướng vĩnh viễn 301 sang HTTPS theo hướng dẫn Lab 1
    return 301 https://$host$request_uri;
}

# 2. Máy chủ HTTPS chính (Cổng 443)
server {
    listen 443 ssl;
    server_name gym.local localhost;

    # Đường dẫn chứng chỉ SSL/TLS tự ký (Self-signed Certificate)
    ssl_certificate /etc/nginx/ssl/gym.local.crt;
    ssl_certificate_key /etc/nginx/ssl/gym.local.key;

    # Giao thức bảo mật SSL/TLS tối ưu (Hardening)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # CÁC SECURITY HEADERS BẢO VỆ NGUY HIỂM (TIÊU CHÍ HARDENING)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com;" always;

    # Tắt hiển thị phiên bản Nginx để chống lộ thông tin trinh sát
    server_tokens off;

    # Reverse proxy tới ứng dụng web Gym (container gym-web)
    location / {
        proxy_pass http://gym-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy quản lý phpMyAdmin qua đường dẫn /pma/
    location /pma/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Trang lỗi tùy biến
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
