# ====================================================================
# GRAFANA DATASOURCE PROVISIONING - HỆ THỐNG GYM & FITNESS (ĐỀ 23)
# Tự động nạp cấu hình kết nối Prometheus và Loki
# ====================================================================

apiVersion: 1

datasources:
  # 1. Nguồn dữ liệu Prometheus Metrics (Lab 7)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  # 2. Nguồn dữ liệu Loki Logs (Lab 8)
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
