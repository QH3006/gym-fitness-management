# ====================================================================
# ALERTMANAGER CONFIGURATION - HỆ THỐNG GYM & FITNESS (ĐỀ 23)
# Dựa trên hướng dẫn Lab 8 (Trang 16, 17)
# ====================================================================

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

receivers:
  - name: 'default'
    # Cấu hình gửi mail thông báo cảnh báo mẫu
    # email_configs:
    #   - to: 'admin@gymfitness.local'
    #     from: 'alerts@gymfitness.local'
    #     smarthost: 'smtp.gmail.com:587'
    #     auth_username: 'alerts@gymfitness.local'
    #     auth_password: 'app-password'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
