# ====================================================================
# GRAFANA PROMTAIL CONFIGURATION - HỆ THỐNG GYM & FITNESS (ĐỀ 23)
# Tự động phát hiện và thu thập toàn bộ log container Docker
# Dựa trên hướng dẫn Lab 8 (Trang 5)
# ====================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Lấy tên container và loại bỏ dấu gạch chéo đầu tiên
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Gán nhãn tên service từ nhãn docker compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
